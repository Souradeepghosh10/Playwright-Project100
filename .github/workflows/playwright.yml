name: 🧪 Run Playwright Tests and Push to Dashboard

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # runs daily at 2 AM UTC (7:30 AM IST)

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Playwright Project
        uses: actions/checkout@v3

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧰 Install Playwright Browsers (only Chromium)
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright Tests (continue on failure)
        run: |
          npx playwright test --project=chromium --retries=0 || true
        continue-on-error: true

      - name: 🚀 Push Report to Dashboard Repo
        if: always()
        run: |
          git clone https://x-access-token:${{ secrets.DASHBOARD_REPO_TOKEN }}@github.com/Souradeepghosh10/playwright-dashboard.git

          REPORT_DATE=$(date +'%Y-%m-%d')
          echo "📅 REPORT_DATE: $REPORT_DATE"

          if [ -d "playwright-report" ]; then
            mkdir -p playwright-dashboard/Reports/$REPORT_DATE/html-report
            cp -r playwright-report/* playwright-dashboard/Reports/$REPORT_DATE/html-report/
            cp playwright-report/report.json playwright-dashboard/Reports/$REPORT_DATE/report.json

            # ✅ Generate root index.html file with link to latest report
            cat <<EOF > playwright-dashboard/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Latest Playwright Test Report</title>
</head>
<body>
  <h1>📊 Latest Playwright Test Report</h1>
  <p>Generated on: $REPORT_DATE</p>
  <a href="Reports/$REPORT_DATE/html-report/index.html" target="_blank">🔗 View Latest Report</a>
</body>
</html>
EOF

            cd playwright-dashboard
            git config user.email "github-actions@github.com"
            git config user.name "github-actions"
            git add .
            git commit -m "📊 Add test report for $REPORT_DATE and update index.html" || echo "No changes to commit"
            git push
          else
            echo "⚠️ Skipping push: playwright-report not found."
          fi
