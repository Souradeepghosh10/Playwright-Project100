name: 🧪 Run Playwright Tests and Push to Dashboard

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # runs daily at 2 AM UTC (7:30 AM IST)

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Playwright Project
        uses: actions/checkout@v3

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧰 Install Playwright Browsers (only Chromium)
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright Tests (Chromium only, no retries)
        run: npx playwright test --project=chromium --retries=0

      - name: 📂 Debug - List Report Folder
        run: ls -R playwright-report || echo "Report folder missing"

      - name: 🚀 Push Report to Dashboard Repo
        run: |
          git clone https://x-access-token:${{ secrets.DASHBOARD_REPO_TOKEN }}@github.com/Souradeepghosh10/playwright-dashboard.git
          mkdir -p playwright-dashboard/Reports/$(date +'%Y-%m-%d')/
          cp -r playwright-report/* playwright-dashboard/Reports/$(date +'%Y-%m-%d')/
          cd playwright-dashboard
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "Add report for $(date +'%Y-%m-%d')"
          git push
