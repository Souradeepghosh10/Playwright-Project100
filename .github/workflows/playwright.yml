name: 🎭 Playwright Tests

on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Run Playwright tests
        run: npx playwright test --reporter html,json

      - name: 📁 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 5

      - name: 🚀 Push Report to Dashboard Repo
        if: always()
        run: |
          git clone https://x-access-token:${{ secrets.DASHBOARD_REPO_TOKEN }}@github.com/Souradeepghosh10/playwright-dashboard.git

          # Use IST for report folder date
          REPORT_DATE=$(TZ='Asia/Kolkata' date +'%Y-%m-%d')
          echo "📅 REPORT_DATE: $REPORT_DATE"

          if [ -d "playwright-report" ]; then
            mkdir -p playwright-dashboard/Reports/$REPORT_DATE/html-report
            cp -r playwright-report/* playwright-dashboard/Reports/$REPORT_DATE/html-report/
            cp playwright-report/report.json playwright-dashboard/Reports/$REPORT_DATE/report.json

            cd playwright-dashboard
            git config user.email "github-actions@github.com"
            git config user.name "github-actions"
            git add .
            git commit -m "📊 Add test report for $REPORT_DATE"
            git push
          else
            echo "⚠️ Skipping push: playwright-report not found."
