name: 💻 Playwright Tests - Chrome Only

on:
  push:
    branches:
      - Master
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧪 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright browsers (Chrome only)
        run: npx playwright install chromium

      - name: 🧪 Run Playwright Tests (Chrome, no retries)
        run: |
          npx playwright test --project=chromium --retries=0
        env:
          CI: true

      - name: 🧾 Generate HTML Report
        run: |
          npx playwright show-report --output=playwright-report

      - name: 📤 Copy HTML & JSON to dashboard and push
        run: |
          # Clone the dashboard repo
          git clone https://x-access-token:${{ secrets.DASHBOARD_REPO_TOKEN }}@github.com/souradeepghosh10/playwright-dashboard.git

          # Create dated folder and copy reports
          REPORT_DIR="playwright-dashboard/Reports/$(date +'%Y-%m-%d')"
          mkdir -p "$REPORT_DIR"
          cp -r playwright-report/* "$REPORT_DIR"/

          # Push to dashboard repo
          cd playwright-dashboard
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "📈 Add report for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
